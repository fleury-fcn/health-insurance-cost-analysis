[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-costs"
version = "2.0.0"
description = "Reproducible analysis and modelling of health insurance costs"
authors = [{ name = "Fleury Niyokwizera" }]
license = { text = "MIT" }
requires-python = ">=3.11"

[project.scripts]
insurance-costs = "insurance_costs.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
insurance_costs = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:.*deprecated - use:DeprecationWarning",
  "ignore::DeprecationWarning:shap.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
