name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, tests and end-to-end pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint (ruff)
        run: ruff check src app tests
      - name: Unit tests (pytest)
        run: pytest
      - name: End-to-end pipeline (fast mode)
        run: insurance-costs run --n-iter 2 --no-mlflow
      - name: Check pipeline outputs
        run: |
          test -s models/best_model.joblib
          test -s reports/generated/report.html
          python -c "import json; m=json.load(open('artifacts/metrics.json')); best=m['models'][m['best_model']]['test']; print(m['best_model'], best); assert best['r2'] > 0.85"

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t insurance-costs .
      - name: Streamlit app answers its health check
        run: |
          docker run -d --name app -p 8501:8501 insurance-costs
          for i in $(seq 1 60); do curl -fs localhost:8501/_stcore/health && exit 0; sleep 2; done
          docker logs app; exit 1
      - name: API predicts from the same image
        run: |
          docker run -d --name api -p 8000:8000 insurance-costs uvicorn app.api:app --host 0.0.0.0
          for i in $(seq 1 60); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs -X POST localhost:8000/predict -H 'Content-Type: application/json' \
            -d '{"age":45,"sex":"male","bmi":32.5,"children":2,"smoker":"yes","region":"southeast"}'
