name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, tests and end-to-end pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint (ruff)
        run: ruff check src app tests
      - name: Unit tests (pytest)
        run: pytest
      - name: End-to-end pipeline (fast mode)
        run: insurance-costs run --n-iter 2 --no-mlflow
      - name: Check pipeline outputs
        run: |
          test -s models/best_model.joblib
          test -s reports/generated/report.html
          python -c "import json; m=json.load(open('artifacts/metrics.json')); best=m['models'][m['best_model']]['test']; print(m['best_model'], best); assert best['r2'] > 0.85"
